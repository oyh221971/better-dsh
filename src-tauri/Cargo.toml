[package]
name = "better-dsh"
version = "0.1.10"
description = "A lightweight, local-first desktop client for DeepSeek Harness, powered by Tauri"
authors = ["better-dsh contributors"]
edition = "2021"

[lib]
name = "better_dsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
